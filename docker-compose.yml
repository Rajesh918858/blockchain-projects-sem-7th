version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: medical-docs-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - medical-network

  backend:
    build: ./backend
    container_name: medical-docs-backend
    environment:
      MONGODB_URI: mongodb://admin:password123@mongo:27017/medical-docs?authSource=admin
      JWT_SECRET: your_jwt_secret_key_here
      PORT: 5000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      NODE_ENV: development
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    networks:
      - medical-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: medical-docs-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - medical-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:

networks:
  medical-network:
    driver: bridge
